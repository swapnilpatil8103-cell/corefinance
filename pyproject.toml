[project]
name = "corefin"
version = "0.1.0"
description = "Vectorized core library for quantitative finance / investment banking projects (sponsor LBO, credit, bank statement models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Credit-Loss Forecasting Engine (corefin/credit/): data fetch, panel storage
# and the model families. Kept optional so the core LBO/optimizer/simulate
# install stays light for users who don't need the FIG credit-risk track.
fig = [
    "pyarrow>=15.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.scripts]
corefin = "corefin.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = [
    "slow: performance/scale tests, excluded by default (run with -m slow)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"src/corefin/cli.py" = ["B008"]  # typer's idiomatic Option()/Argument() defaults
