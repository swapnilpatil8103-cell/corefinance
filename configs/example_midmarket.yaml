# Fictional mid-market services company LBO.
# ~$500mm revenue, ~20% EBITDA margin, 5.5x total leverage (3.75x TLB + 1.75x
# senior notes; revolver undrawn at close). All dollar figures are $mm, all
# rates/margins/percentages are decimal fractions, multiples are bare floats.

timeline:
  n_periods: 7
  n_historical: 0
  start_year: 2025

company:
  revenue_base_mm: 500.0
  revenue_growth: 0.05
  ebitda_margin: 0.20
  da_pct_revenue: 0.03
  capex_pct_revenue: 0.035
  nwc_pct_revenue: 0.12
  tax_rate: 0.26
  nol_beginning_balance_mm: 0.0
  dividend_pct_of_ni: 0.0

# Post-close (period 0 start) balance sheet: debt tranches are already funded
# at face value as of this snapshot, so equity_mm is the sponsor's entry
# equity check, not a pre-deal book value. See OpeningBalanceSheet's docstring.
opening_balance_sheet:
  cash_mm: 15.0
  nwc_mm: 60.0
  ppe_mm: 150.0
  goodwill_mm: 591.0
  deferred_financing_costs_mm: 5.5
  other_liabilities_mm: 0.0
  equity_mm: 271.5

transaction:
  entry_multiple: 8.0
  transaction_fees_pct: 0.02
  exit_year_index: 6

tranches:
  - name: Revolver
    tranche_type: revolver
    size_mm: 50.0
    rate_type: floating
    spread: 0.04
    rate_floor: 0.0
    commitment_fee_pct: 0.005
    cash_sweep_eligible: false

  - name: TLB
    tranche_type: term_loan_b
    size_mm: 375.0
    rate_type: floating
    spread: 0.05
    rate_floor: 0.01
    mandatory_amort_pct_of_original: 0.01
    upfront_fee_pct: 0.01
    cash_sweep_eligible: true
    sweep_priority: 1

  - name: SeniorNotes
    tranche_type: senior_notes
    size_mm: 175.0
    rate_type: fixed
    fixed_rate: 0.085
    oid_pct: 0.01
    cash_sweep_eligible: true
    sweep_priority: 2

covenants:
  - name: Max Total Net Leverage
    metric: total_net_leverage
    threshold: [5.5, 5.25, 5.0, 4.5, 4.0, 3.5, 3.0]
    test_from_period: 0

  - name: Min Interest Coverage
    metric: interest_coverage
    threshold: 2.0
    test_from_period: 0

scenario:
  n_scenarios: 1000
  random_seed: 42
  exit_multiple: 8.0
  base_rate: 0.045
  driver_vol:
    revenue_growth_std: 0.03
    ebitda_margin_std: 0.015
    capex_pct_revenue_std: 0.005
    nwc_pct_revenue_std: 0.01
    exit_multiple_std: 0.5
    base_rate_std: 0.005

waterfall:
  minimum_cash_mm: 15.0
  sweep_pct: 1.0
  interest_mode: average_balance
  circularity_tolerance: 1.0e-6
  circularity_max_iterations: 50
