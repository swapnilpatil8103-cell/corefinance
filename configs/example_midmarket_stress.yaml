# Same fictional mid-market services company LBO as example_midmarket.yaml,
# with a scenario.advanced block added to demonstrate the Sponsor LBO Monte
# Carlo engine's richer scenario generation (persistence, recession regimes,
# fat tails, mean-reverting rates, a fundamentals-linked exit multiple).
# Every value in the advanced block is illustrative, not calibrated to any
# real dataset or company -- it exists to demonstrate the mechanism, not to
# represent this fictional company's true risk. All dollar figures are $mm,
# all rates/margins/percentages are decimal fractions, multiples are bare
# floats.

timeline:
  n_periods: 7
  n_historical: 0
  start_year: 2025

company:
  revenue_base_mm: 500.0
  revenue_growth: 0.05
  ebitda_margin: 0.20
  da_pct_revenue: 0.03
  capex_pct_revenue: 0.035
  nwc_pct_revenue: 0.12
  tax_rate: 0.26
  nol_beginning_balance_mm: 0.0
  dividend_pct_of_ni: 0.0

# Post-close (period 0 start) balance sheet: debt tranches are already funded
# at face value as of this snapshot, so equity_mm is the sponsor's entry
# equity check, not a pre-deal book value. See OpeningBalanceSheet's docstring.
opening_balance_sheet:
  cash_mm: 15.0
  nwc_mm: 60.0
  ppe_mm: 150.0
  goodwill_mm: 591.0
  deferred_financing_costs_mm: 5.5
  other_liabilities_mm: 0.0
  equity_mm: 271.5

transaction:
  entry_multiple: 8.0
  transaction_fees_pct: 0.02
  exit_year_index: 6

tranches:
  - name: Revolver
    tranche_type: revolver
    size_mm: 50.0
    rate_type: floating
    spread: 0.04
    rate_floor: 0.0
    commitment_fee_pct: 0.005
    cash_sweep_eligible: false

  - name: TLB
    tranche_type: term_loan_b
    size_mm: 375.0
    rate_type: floating
    spread: 0.05
    rate_floor: 0.01
    mandatory_amort_pct_of_original: 0.01
    upfront_fee_pct: 0.01
    cash_sweep_eligible: true
    sweep_priority: 1

  - name: SeniorNotes
    tranche_type: senior_notes
    size_mm: 175.0
    rate_type: fixed
    # Unsecured -- prices above the TLB's ~9.5% all-in (4.5% base + 5.0%
    # spread) since it ranks behind the secured TLB in a default.
    # Illustrative, not market data.
    fixed_rate: 0.1025
    oid_pct: 0.01
    # High-yield notes are typically call-protected rather than swept from
    # excess cash; the sweep goes to the term loan (see TLB above).
    cash_sweep_eligible: false

covenants:
  # Max leverage starts ~25% above closing leverage (5.5x -> 7.0x) and
  # steps down linearly to 5.0x by the final period, giving working
  # headroom instead of testing right at the closing level. Springing at
  # 35% revolver draw: sponsor term loans are typically covenant-lite,
  # with the leverage test applying only to the revolver and only once
  # it's meaningfully drawn.
  - name: Max Total Net Leverage
    metric: total_net_leverage
    threshold: [7.00, 6.67, 6.33, 6.00, 5.67, 5.33, 5.00]
    test_from_period: 0
    springing_revolver_draw_pct: 0.35

  # Regular (non-springing) maintenance covenant, loosened from 2.0x to
  # 1.5x -- coverage at close was already thin (~2.1x) against a 2.0x
  # threshold, flagging normal scenario noise as a breach.
  - name: Min Interest Coverage
    metric: interest_coverage
    threshold: 1.5
    test_from_period: 0

scenario:
  n_scenarios: 1000
  random_seed: 42
  exit_multiple: 8.0
  base_rate: 0.045
  driver_vol:
    revenue_growth_std: 0.03
    ebitda_margin_std: 0.015
    capex_pct_revenue_std: 0.005
    nwc_pct_revenue_std: 0.01
    exit_multiple_std: 0.5
    base_rate_std: 0.005

  # Richer Monte Carlo generation (Stage 2 of the Sponsor LBO Monte Carlo
  # engine) -- every field below is illustrative, not calibrated. Leaving
  # this whole block out (as example_midmarket.yaml does) reproduces the
  # simple i.i.d.-shock generator exactly; corefin run/optimize never read
  # this block at all.
  advanced:
    persistence:
      # AR(1) autocorrelation: a bad (or good) year has some tendency to be
      # followed by another one, instead of every period being independent
      # noise. 0.5 is a moderate, illustrative persistence.
      revenue_growth_phi: 0.5
      ebitda_margin_phi: 0.5
    regime:
      # ~10%/year chance of a new 2-year recession starting -- illustrative,
      # not fit to any macro dataset. Hits reuse the same magnitudes as the
      # deterministic "Recession in Year 2" stress scenario below.
      annual_probability: 0.10
      duration_years: 2
      revenue_growth_hit: -0.10
      ebitda_margin_hit: -0.03
    fat_tails:
      # Student-t innovations instead of normal; lower degrees of freedom =
      # fatter tails. 5 is a common illustrative choice, not fit to data.
      degrees_of_freedom: 5.0
    rate_mean_reversion:
      # Illustrative speed of reversion and long-run level, below the 4.5%
      # entry base rate -- demonstrates the mechanism, not a rate forecast.
      kappa: 0.3
      long_run_mean: 0.04
    exit_multiple_link:
      # Illustrative sensitivities, not fit to any comparable transaction
      # data. reference_cagr matches the base case's own ~5% EBITDA CAGR
      # (flat margin), so the growth term is ~0 in the unshocked case.
      beta_growth: 3.0
      reference_cagr: 0.05
      beta_rate: -3.0
      reference_rate: 0.045

waterfall:
  minimum_cash_mm: 15.0
  sweep_pct: 1.0
  interest_mode: average_balance
  circularity_tolerance: 1.0e-6
  circularity_max_iterations: 50

# Financing Structure Optimizer: search over TLB and Senior Notes size for
# the structure that maximizes sponsor returns subject to the constraints
# below. Revolver commitment stays fixed at 50mm (not a decision variable).
# The pricing grid, capacity limits and constraint thresholds here are
# ILLUSTRATIVE placeholders for demonstrating the optimizer, not real market
# data -- replace with actual lender feedback before using this for a live
# deal.
optimizer:
  decision_variables:
    # min/max are turns of entry EBITDA (100mm). SeniorNotes' upper bound was
    # previously 3.0x, which turned out to be an arbitrary grid limit (not an
    # economic one) that the optimizer kept hitting -- widened to 5.0x, same
    # as TLB, so the real constraints below do the limiting instead.
    - tranche_name: TLB
      min_multiple: 2.0
      max_multiple: 5.0
    - tranche_name: SeniorNotes
      min_multiple: 0.5
      max_multiple: 5.0

  pricing:
    # Illustrative only: spread/fee step-ups per turn of leverage above each
    # threshold, roughly bracketing the example's 5.5x closing leverage --
    # not sourced from any real lender or market data. TLB is secured (term
    # loan B), so its pricing is driven by SECURED leverage (TLB + drawn
    # revolver); Senior Notes are unsecured by default, priced off TOTAL
    # leverage instead, matching how the two tranches are actually priced in
    # a real LBO.
    tranches:
      - tranche_name: TLB
        basis: secured_leverage
        leverage_threshold: 5.0
        spread_bps_per_turn: 0.0075 # +75bps of spread per turn above 5.0x secured
        upfront_fee_pct_per_turn: 0.0025
        market_capacity_mm: 500.0 # illustrative TLB market depth cap
      - tranche_name: SeniorNotes
        basis: total_leverage
        leverage_threshold: 5.0
        spread_bps_per_turn: 0.0125 # notes price wider/steeper than TLB
        oid_pct_per_turn: 0.0025
        market_capacity_mm: 300.0 # illustrative notes market depth cap
    total_market_capacity_mm: 700.0 # illustrative total debt capacity

  deterministic_constraints:
    max_total_leverage: 6.5
    # Secured (TLB + drawn revolver) leverage cap, distinct from total
    # leverage now that Senior Notes are unsecured by default. TLB alone can
    # reach 5.0x per its own decision-variable bound, so 5.25x caps secured
    # leverage just above that -- illustrative, not market data.
    max_secured_leverage: 5.25
    # Sponsor equity has typically run ~40-50% of sources in recent years
    # (illustrative, not deal-specific); raised from 25% accordingly.
    min_equity_pct_of_sources: 0.40
    min_interest_coverage_at_close: 1.5 # matches the Min Interest Coverage covenant

  stochastic_constraints:
    max_covenant_breach_probability: 0.10
    max_revolver_shortfall_probability: 0.05
    max_loss_of_capital_probability: 0.05

  objective:
    # mean IRR shaded toward the downside (p10): mean - 0.5*(mean - p10),
    # so the search doesn't just chase mean IRR into fragile territory.
    kind: mean_downside_blend
    percentile: 10.0
    downside_lambda: 0.5

  search:
    n_scenarios_search: 2000
    n_scenarios_confirm: 10000
    random_seed: 42
    grid_points_per_dimension: 15
    refine: true
    refine_grid_points_per_dimension: 9

# Sponsor LBO Monte Carlo Engine: `corefin simulate` stress-tests a
# structure (by default the input config's own structure, the optimizer's
# recommendation, and a +1.0x TLB more-levered variant) with richer
# scenario generation, named deterministic stress scenarios, downside/
# distress analytics, returns attribution and driver importance. The
# hurdle and stress shocks below are illustrative, not market data.
simulate:
  irr_hurdle: 0.15 # illustrative sponsor return threshold
  stress_scenarios:
    - name: Recession in Year 2
      shocks:
        recession:
          # start_year_index is 0-indexed -- 1 is the second projection
          # year ("Year 2"), matching this scenario's name.
          start_year_index: 1
          revenue_growth_hit: -0.10 # 10pp lower growth at the peak
          ebitda_margin_hit: -0.03 # 300bps lower margin at the peak
          recovery_years: 2 # tapers back to zero over the following 2 years
    - name: Rate Shock (+300bps)
      shocks:
        rate_shock:
          bps: 0.03 # permanent, held base-rate increase
    - name: Multiple Compression (-2.0x)
      shocks:
        multiple_compression:
          delta: -2.0 # exit multiple 2.0x lower than the base case
    - name: Combined Downside
      shocks:
        recession:
          start_year_index: 1 # same timing as "Recession in Year 2" above
          revenue_growth_hit: -0.10
          ebitda_margin_hit: -0.03
          recovery_years: 2
        rate_shock:
          bps: 0.03
        multiple_compression:
          delta: -2.0
